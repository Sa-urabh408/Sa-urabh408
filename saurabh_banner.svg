<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes lineGrow {
        from { stroke-dashoffset: 300; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes subtleGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(122,162,247,0.4)); }
        50%       { filter: drop-shadow(0 0 18px rgba(122,162,247,0.7)); }
      }
      @keyframes tagFade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes dotPulse {
        0%, 100% { r: 4; opacity: 0.8; }
        50%       { r: 5.5; opacity: 1; }
      }

      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #e6edf3;
        letter-spacing: 2px;
        animation: fadeIn 0.8s ease forwards, subtleGlow 4s ease-in-out infinite 1s;
      }
      .tagline {
        font-family: 'Courier New', monospace;
        font-size: 13.5px;
        fill: #7aa2f7;
        letter-spacing: 3px;
        opacity: 0;
        animation: tagFade 0.6s ease forwards 1.2s;
      }
      .cursor {
        fill: #7aa2f7;
        animation: cursorBlink 1.1s step-end infinite 1.8s;
      }
      .line {
        stroke: #7aa2f7;
        stroke-width: 1.5;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: lineGrow 0.7s ease forwards 0.5s;
        opacity: 0.5;
      }
      .dot {
        animation: dotPulse 2.5s ease-in-out infinite;
      }
      .badge {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        fill: #9ece6a;
        opacity: 0;
        animation: tagFade 0.5s ease forwards 1.6s;
      }
      .bracket {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: 300;
        fill: #7aa2f7;
        opacity: 0.35;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="160" fill="#0d1117"/>

  <!-- Subtle top border gradient line -->
  <defs>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="30%"  stop-color="#7aa2f7" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#7aa2f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="botLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="30%"  stop-color="#3d59a1" stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#3d59a1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0"   width="860" height="1.5" fill="url(#topLine)"/>
  <rect x="0" y="158" width="860" height="1.5" fill="url(#botLine)"/>

  <!-- Decorative dots left -->
  <circle class="dot" cx="38" cy="80" r="4" fill="#7aa2f7" opacity="0.8"/>
  <circle cx="58" cy="80" r="3" fill="#3d59a1" opacity="0.5"/>
  <circle cx="74" cy="80" r="2" fill="#3d59a1" opacity="0.3"/>

  <!-- Decorative dots right -->
  <circle class="dot" cx="822" cy="80" r="4" fill="#7aa2f7" opacity="0.8"/>
  <circle cx="802" cy="80" r="3" fill="#3d59a1" opacity="0.5"/>
  <circle cx="786" cy="80" r="2" fill="#3d59a1" opacity="0.3"/>

  <!-- Bracket left (decorative) -->
  <text class="bracket" x="88" y="100" text-anchor="start">{</text>

  <!-- Bracket right (decorative) -->
  <text class="bracket" x="772" y="100" text-anchor="end">}</text>

  <!-- Horizontal accent lines -->
  <line class="line" x1="280" y1="42" x2="580" y2="42"/>
  <line class="line" x1="280" y1="118" x2="580" y2="118" style="animation-delay: 0.7s"/>

  <!-- MAIN NAME -->
  <text class="name" x="430" y="95" text-anchor="middle">Saurabh Kalamkar</text>

  <!-- Tagline with cursor -->
  <text class="tagline" x="430" y="138" text-anchor="middle">
    Android Dev  ·  Full-Stack  ·  Open Source
  </text>

  <!-- Small status badge top-right corner -->
  <text class="badge" x="430" y="26" text-anchor="middle">[ AVAILABLE FOR COLLABORATION ]</text>

</svg>
